name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run lint
        run: npm run lint

      - name: Check student timer sessions
        run: npm run check:student-timers

      - name: Check entitlement resolution
        run: node scripts/check-entitlement-resolution.mjs

      - name: Check routine reward policies and entitlement parity
        run: npm run check:routine-reward-helpers && npm run check:routine-entitlements && npm run check:routine-view-model

      - name: Check product direction contracts
        run: npm run check:direction-contracts

      - name: Check fixture contracts and local-only safety
        run: npm run check:direction-fixtures

      - name: Run build
        run: npm run build

  product-direction-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium
      - name: Persisted rules, callable, and browser checks on isolated demo project
        run: npm run check:direction-emulators
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-direction-browser-failures
          path: tmp/product-direction/browser-results
          if-no-files-found: ignore
