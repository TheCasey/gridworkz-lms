prompt_policy:
  read_first_max_items: 6
  allowed_discovery: "Start with the listed read-first files, then follow imports, routes, adjacent tests, and nearby implementation files only as needed. Do not preload broad workflow or product background unless the active phase exposes a concrete blocker."
coordination:
  project_manager_role: "user"
  ask_pm_before_guessing: true
  question_policy: "The user authorized execution of the proposed plan on 2026-10-12. Apply its recommended defaults. Ask only for genuinely new product intent or missing required external access; continue independent work."
  manual_assist_policy: "If validation is blocked by a missing simulator, physical device, account, credential, service, fixture, or human-only check, pause and ask the project manager for setup help or a manual verification pass instead of treating the phase as conclusively failed."
  decision_recording: "Record accepted defaults and external blockers in decisions.md, environment-inventory.md, and active run-log.md."
  subagents:
    prefer_subagents: true
    fork_context_default: false
    one_downstream_agent_at_a_time: true
    fallback: "When subagent spawning is unavailable, output the exact downstream prompt so the project manager can start a manual chat with the same role contract."
    model_policy:
      master-developer:
        model: "gpt-6.1-sol"
        reasoning_effort: "medium"
      developer:
        model: "gpt-6.1-sol"
        reasoning_effort: "high"
      tester:
        model: "gpt-6.1-sol"
        reasoning_effort: "medium"
      researcher:
        model: "gpt-6-luna"
        reasoning_effort: "medium"
    escalation_rules:
      - "Use gpt-6-astra high only for a bounded trust/migration/payment review or reproducible unresolved hard failure."
